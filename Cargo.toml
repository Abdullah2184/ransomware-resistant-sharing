[workspace]
resolver = "3"

members = [
    "apps/cli",

    "crates/domain",
    "crates/application",
    "crates/ports",
    "crates/crypto",
    "crates/ipfs_adapter",
    "crates/chain_adapter",
    "crates/key_custody",
    "crates/scanner",
    "crates/metadata_store",

    "services/gateway",
    "services/indexer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = { version = "=0.22.1" }
cid = { version = "=0.11.3" }
getrandom = { version = "=0.3.4" }
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "aes", "x25519"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "query", "stream", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145" }
sha3 = { version = "=0.10.8" }
tokio-util = { version = "=0.7.20", features = ["io"] }

sqlx = {
    version = "0.9.0",
    default-features = false,
    features = [
        "postgres",
        "runtime-tokio",
        "tls-rustls-ring-webpki",
        "migrate",
        "macros",
    ],
}
zeroize = { version = "=1.8.2" }

tokio = {
    version = "1.54.1",
    features = [
        "macros",
        "rt-multi-thread",
        "signal",
        "sync",
        "time",
        "io-util",
        "net",
    ],
}
