[workspace]
resolver = "3"

members = [
    "apps/cli",

    "crates/domain",
    "crates/application",
    "crates/ports",
    "crates/crypto",
    "crates/ipfs_adapter",
    "crates/chain_adapter",
    "crates/key_custody",
    "crates/scanner",
    "crates/metadata_store",

    "services/gateway",
    "services/indexer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
sqlx = {
    version = "0.9.0",
    default-features = false,
    features = [
        "postgres",
        "runtime-tokio",
        "tls-rustls-ring-webpki",
        "migrate",
        "macros",
    ],
}

tokio = {
    version = "1.54.1",
    features = [
        "macros",
        "rt-multi-thread",
        "signal",
        "sync",
        "time",
    ],
}
